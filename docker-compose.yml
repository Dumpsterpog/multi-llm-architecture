# Local production-like stack: API + Postgres + Redis.
#   docker compose up --build
# Then: curl localhost:8080/ready
#
# Put provider keys in a .env file next to this one (see .env.example).
services:
  api:
    build: .
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      # "development" here so the mock provider and dev login keep working
      # locally. Real deployments set NODE_ENV=production.
      NODE_ENV: development
      STORE: postgres
      DATABASE_URL: postgres://mlm:mlm@postgres:5432/mlm
      KV: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlm
      POSTGRES_PASSWORD: mlm
      POSTGRES_DB: mlm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start, to create the tables.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
